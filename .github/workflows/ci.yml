name: Offline regression and locked dependencies
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the complete hash-locked environment
        run: python -m pip install --require-hashes -r scripts/requirements.lock
      - name: Check dependencies and imports without downloading models
        run: |
          python -m pip check
          python -c "import requests, yt_dlp, faster_whisper, av, ctranslate2, onnxruntime, numpy, opencc, segno"
      - name: Compile and run offline regressions
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
